  user_service:

    build:

      context: ./services/user_service

    container_name: ${CONTAINER_NAME}

    restart: unless-stopped

    env_file:

      - ./services/user_service/.test.env

    depends_on:

      postgres:

        condition: service_healthy

    ports:

      - "${APP_EXTERNAL_PORT}:${APP_INTERNAL_PORT}"

    healthcheck:

      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_INTERNAL_PORT}/healthcheck || exit 1" ]

      interval: 180s

      timeout: 5s

      retries: 5

      start_period: 20s

    networks:

      - backend



