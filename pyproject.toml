[project]
name = "fastapi-marketplace-e2e"
version = "0.1.0"
description = "Black-box e2e tests for FastAPI Marketplace microservices"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
e2e = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests/e2e"]
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests against a running Compose stack",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
